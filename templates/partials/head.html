<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3d6df0">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.subtitle }}{% end %}</title>
<meta name="description" content="{{ page.description | default: site.description | truncate: 160 }}">
<meta name="author" content="{{ site.author.name }}">
{% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% end %}
<link rel="canonical" href="{{ page.url | abs }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | url }}">
<link rel="icon" href="{{ "/assets/img/favicon.svg" | url }}" type="image/svg+xml">
<link rel="sitemap" type="application/xml" href="{{ "/sitemap.xml" | url }}">

<meta property="og:type" content="{% if page.kind == 'post' %}article{% else %}website{% end %}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="{{ site.locale }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | truncate: 160 }}">
<meta property="og:url" content="{{ page.url | abs }}">
{% if page.image %}<meta property="og:image" content="{{ page.image | abs }}">{% end %}
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ "/assets/css/style.css" | asset }}">

<script>
  /* 첫 페인트 전에 테마를 확정해 깜빡임을 없앤다 */
  (function () {
    try {
      var t = localStorage.getItem('gaon.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
{% if page.kind == 'post' %}
<script type="application/ld+json">
{ "@context":"https://schema.org","@type":"BlogPosting",
  "headline":{{ page.title | json }},
  "datePublished":{{ page.iso | json }},
  "author":{"@type":"Person","name":{{ site.author.name | json }}},
  "mainEntityOfPage":{{ page.url | abs | json }} }
</script>
{% end %}
