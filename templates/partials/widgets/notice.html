{% if notice %}
<section class="widget w-notice">
  <h3 class="w-t">{% include "icon.html" name="mega" %} 공지사항</h3>
  <ul class="notice-l">
    {% for n in notice | limit: 3 %}
    <li><a href="{{ n.url | url }}"><span>{{ n.text }}</span><time>{{ n.date }}</time></a></li>
    {% end %}
  </ul>
</section>
{% end %}
