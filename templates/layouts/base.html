<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
{% include "head.html" %}
</head>
<body>
{% include "header.html" %}

<main id="main" class="wrap layout{% if page.wide %} wide{% end %}">
  <div class="content">{{ content }}</div>
  {% if not page.wide %}{% include "sidebar.html" %}{% end %}
</main>

{% include "footer.html" %}
{% include "chat-panel.html" %}
<div class="nav-dim" id="navDim" hidden></div>

<script src="{{ "/assets/js/config.js" | url }}"></script>
<script src="{{ "/assets/js/core.js" | url }}" defer></script>
<script src="{{ "/assets/js/store.js" | url }}" defer></script>
<script src="{{ "/assets/js/widgets.js" | url }}" defer></script>
<script src="{{ "/assets/js/chat.js" | url }}" defer></script>
<script src="{{ "/assets/js/gh.js" | url }}" defer></script>
<script src="{{ "/assets/js/owner.js" | url }}" defer></script>
{% if page.kind == "post" %}<script src="{{ "/assets/js/post.js" | url }}" defer></script>{% end %}
{% if page.script %}<script src="{{ page.script | url }}" defer></script>{% end %}
</body>
</html>
