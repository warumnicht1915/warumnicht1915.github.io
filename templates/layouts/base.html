<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
{% include "head.html" %}
</head>
<body>
{% include "chat-mascot.html" %}
{% include "header.html" %}

<main id="main" class="wrap layout{% if page.wide %} wide{% end %}">
  <div class="content">{{ content }}</div>
  {% if not page.wide %}{% include "sidebar.html" %}{% end %}
</main>

{% include "footer.html" %}
{% include "chat-panel.html" %}
<div class="nav-dim" id="navDim" hidden></div>

<script src="{{ "/assets/js/config.js" | asset }}"></script>
<!-- gh.js 는 관리자 여부를 판단하는 기준이라 다른 스크립트보다 먼저 와야 한다 -->
<script src="{{ "/assets/js/gh.js" | asset }}" defer></script>
<script src="{{ "/assets/js/core.js" | asset }}" defer></script>
<script src="{{ "/assets/js/store.js" | asset }}" defer></script>
<script src="{{ "/assets/js/widgets.js" | asset }}" defer></script>
<script src="{{ "/assets/js/chat.js" | asset }}" defer></script>
<script src="{{ "/assets/js/comments.js" | asset }}" defer></script>
<script src="{{ "/assets/js/editor-modal.js" | asset }}" defer></script>
<script src="{{ "/assets/js/owner.js" | asset }}" defer></script>
{% if page.kind == "post" %}<script src="{{ "/assets/js/post.js" | asset }}" defer></script>{% end %}
{% if page.script %}<script src="{{ page.script | asset }}" defer></script>{% end %}
</body>
</html>
